version: 2.1

orbs:
  ecr: pagerduty/ecr@0.0.4
  git: pagerduty/git@0.0.3        # https://circleci.com/orbs/registry/orb/pagerduty/git
  elixir: pagerduty/elixir@0.0.9  # https://circleci.com/orbs/registry/orb/pagerduty/elixir

working_dir: &working_dir
  working_directory: /tmp/workspace

base-image: &base-image
  image: cimg/base:stable-20.04

executors:
  elixir-dev-small:
    <<: *working_dir
    resource_class: small
    docker:
      - <<: *base-image
  elixir-dev-medium:
    <<: *working_dir
    resource_class: medium
    docker:
      - <<: *base-image

setup_access_to_github: &setup_access_to_github
  run:
    name: Set up access to GitHub via SSH
    command: |
      ssh-add -D && echo "${GITHUB_SSH_KEY}" | base64 --decode | ssh-add -

commands:
  setup_service:
    steps:
      - <<: *setup_access_to_github
      - run:
          name: Update packages
          command: |
            sudo apt-get update
            sudo apt-get install -y libncurses5-dev
      - checkout
      - git/rebase_on_main
      - elixir/install:
          asdf_version: "v0.11.1"
      - elixir/mix_get_and_compile_deps

jobs:
  format:
    executor: elixir-dev-small
    environment:
      MIX_ENV: dev
    steps:
      - setup_service
      - run: mix format --check-formatted
  compiler_warnings:
    executor: elixir-dev-small
    environment:
      MIX_ENV: dev
    steps:
      - setup_service
      - run: mix compile --force --warnings-as-errors
  test:
    executor: elixir-dev-small
    environment:
      MIX_ENV: test
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - setup_service
      - run: mix test

workflows:
  version: 2
  test_and_publish:
    jobs:
      - format:
          context:
            - PagerDuty
            - ECR Production
          filters:
            branches:
              ignore:
                - master
      - compiler_warnings:
          context:
            - PagerDuty
            - ECR Production
          filters:
            branches:
              ignore:
                - master
      - test:
          context:
            - PagerDuty
            - ECR Production
          filters:
            branches:
              ignore:
                - master
